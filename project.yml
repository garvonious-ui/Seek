name: Seek
options:
  bundleIdPrefix: com.seek
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 9
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_CFBundleDisplayName: "Seek"
    INFOPLIST_KEY_UIUserInterfaceStyle: Light
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save verse cards to your photo library."
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targets:
  Seek:
    type: application
    platform: iOS
    sources:
      - path: Seek
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Seek/Resources
        excludes:
          - "**/.DS_Store"
      - path: Seek/Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loucesario.seek
        DEVELOPMENT_TEAM: 6QU295KVS2
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: Seek/Seek.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
