name: Seek
options:
  bundleIdPrefix: com.seek
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  # Meta (Facebook) SDK — added for iOS app-install ad measurement (SKAdNetwork).
  # Only FacebookCore (FBSDKCoreKit) is used; no FB Login/Share.
  FacebookSDK:
    url: https://github.com/facebook/facebook-ios-sdk
    from: "17.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: 13
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_CFBundleDisplayName: "Seek"
    INFOPLIST_KEY_UIUserInterfaceStyle: Light
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save verse cards to your photo library."
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targets:
  Seek:
    type: application
    platform: iOS
    sources:
      - path: Seek
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Seek/Resources
        excludes:
          - "**/.DS_Store"
      - path: Seek/Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
      - package: FacebookSDK
        product: FacebookCore
      - target: SeekWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loucesario.seek
        DEVELOPMENT_TEAM: 6QU295KVS2
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        # Partial Info.plist holding keys that can't be expressed as build settings
        # (Facebook SDK keys + SKAdNetworkItems array). Xcode 16 merges the
        # auto-generated keys (from GENERATE_INFOPLIST_FILE + INFOPLIST_KEY_*)
        # ON TOP of this file, so the launch screen / orientations / etc. above
        # are preserved.
        INFOPLIST_FILE: Seek/Info.plist
    entitlements:
      path: Seek/Seek.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.loucesario.seek

  SeekWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SeekWidget
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loucesario.seek.SeekWidget
        DEVELOPMENT_TEAM: 6QU295KVS2
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SeekWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Seek"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        # Widgets cannot be light-mode-locked via the app plist key, so we set
        # explicit colors in code and don't force UIUserInterfaceStyle here.
    entitlements:
      path: SeekWidget/SeekWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.loucesario.seek
